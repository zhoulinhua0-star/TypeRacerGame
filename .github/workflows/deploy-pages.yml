name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate passage database
        run: node scripts/validate-texts.mjs
      - name: Test difficulty scoring
        run: node scripts/test-difficulty-score.mjs
      - name: Test web passage logic
        run: node scripts/test-web-logic.mjs
      - name: Test landing-page keyboard guide
        run: node scripts/test-keyboard-guide.mjs
      - name: Test site links and metadata
        run: node scripts/test-site-metadata.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: PrecisionTyper
      - uses: actions/deploy-pages@v4
        id: deployment
