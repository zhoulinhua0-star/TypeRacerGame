<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PrecisionTyper</title>
  <desc id="desc">Exact-match typing practice with 237 passages across twelve quantitatively separated collection and difficulty pools, shown beside a live typing canvas.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10201c"/>
      <stop offset="1" stop-color="#0a1210"/>
    </linearGradient>
    <pattern id="key-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#5eead4" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#050807"/>
  <rect width="1200" height="420" rx="28" fill="url(#key-grid)"/>
  <path d="M0 96H1200" stroke="#5eead4" stroke-opacity="0.1"/>

  <g id="identity" transform="translate(64 54)">
    <g transform="translate(0 0)">
      <rect width="40" height="40" rx="12" fill="#102b25" stroke="#5eead4" stroke-opacity="0.35"/>
      <path d="M23 7L11 23h9l-2 10 12-17h-9z" fill="none" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="16" fill="#9db8b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.2">TYPE RACER GAME</text>
      <text x="56" y="38" fill="#6b827d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">WEB  /  SWING  /  CLI</text>
    </g>

    <text x="0" y="112" fill="#e7fbf7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.2">Precision<tspan fill="#5eead4">Typer</tspan></text>
    <rect x="3" y="128" width="7" height="46" rx="3.5" fill="#f97316"/>
    <text x="28" y="146" fill="#e7fbf7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="650">Train for exactness.</text>
    <text x="28" y="178" fill="#9db8b3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Or settle into the flow.</text>

    <g transform="translate(0 226)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g>
        <rect width="134" height="54" rx="12" fill="#0f1916" stroke="#5eead4" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#5eead4" font-size="19" font-weight="700">237</text>
        <text x="16" y="42" fill="#6b827d" font-size="12" font-weight="700" letter-spacing="1">PASSAGES</text>
      </g>
      <g transform="translate(146 0)">
        <rect width="134" height="54" rx="12" fill="#0f1916" stroke="#5eead4" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#5eead4" font-size="19" font-weight="700">12</text>
        <text x="16" y="42" fill="#6b827d" font-size="12" font-weight="700" letter-spacing="1">LEVEL POOLS</text>
      </g>
      <g transform="translate(292 0)">
        <rect width="154" height="54" rx="12" fill="#0f1916" stroke="#5eead4" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#5eead4" font-size="19" font-weight="700">0</text>
        <text x="16" y="42" fill="#6b827d" font-size="12" font-weight="700" letter-spacing="1">DEPENDENCIES</text>
      </g>
    </g>
  </g>

  <g id="typing-canvas" transform="translate(570 46)">
    <rect width="566" height="328" rx="22" fill="url(#panel)" stroke="#5eead4" stroke-opacity="0.24"/>
    <g transform="translate(28 27)">
      <text x="0" y="18" fill="#9db8b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.4">TYPING CANVAS</text>
      <rect x="174" y="0" width="124" height="27" rx="13.5" fill="#123129"/>
      <text x="236" y="18" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">STRICT MATCH</text>
      <text x="510" y="18" text-anchor="end" fill="#f97316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">ZEN ON</text>
    </g>

    <path d="M28 82H538" stroke="#5eead4" stroke-opacity="0.12"/>

    <g transform="translate(28 116)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="550">
      <text x="0" y="0" fill="#34d399">A precise typist reads</text>
      <text x="0" y="39" fill="#34d399">punctuation before</text>
      <rect x="249" y="15" width="3" height="30" rx="1.5" fill="#f97316"/>
      <text x="258" y="39" fill="#9db8b3">pressing</text>
      <text x="0" y="78" fill="#647a75">the next key.</text>
    </g>

    <g transform="translate(28 234)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g>
        <text x="0" y="0" fill="#6b827d" font-size="13" font-weight="700" letter-spacing="1">WPM</text>
        <text x="0" y="30" fill="#5eead4" font-size="22" font-weight="700">LIVE</text>
      </g>
      <g transform="translate(114 0)">
        <text x="0" y="0" fill="#6b827d" font-size="13" font-weight="700" letter-spacing="1">ACCURACY</text>
        <text x="0" y="30" fill="#5eead4" font-size="22" font-weight="700">EXACT</text>
      </g>
      <g transform="translate(264 0)">
        <text x="0" y="0" fill="#6b827d" font-size="13" font-weight="700" letter-spacing="1">NEXT</text>
        <text x="0" y="30" fill="#e7fbf7" font-size="22" font-weight="700">ENTER</text>
      </g>
    </g>

    <rect x="28" y="292" width="510" height="1" fill="#5eead4" fill-opacity="0.1"/>
    <text x="28" y="316" fill="#6b827d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">/ type  ·  Enter check  ·  Tab settings  ·  Esc restart</text>
  </g>
</svg>
